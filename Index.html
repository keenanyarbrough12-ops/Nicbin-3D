<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nicbin 3D</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
      body {
        margin: 0;
        background: #0b0b0b;
      }
      model-viewer {
        width: 100vw;
        height: 100vh;
        background: #0b0b0b;
      }
    </style>
  </head>
  <body>
    <model-viewer
      src="Nicbin_REV-B_viewable.glb"
      alt="Nicbin 3D Model"
      camera-controls
      auto-rotate
      rotation-per-second="20deg"
      shadow-intensity="0.8"
      exposure="1.0"
      ar
      ar-modes="webxr scene-viewer quick-look">
    </model-viewer>
  </body>
</html>
